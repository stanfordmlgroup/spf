[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "spf"
version = "0.1.0"
description = "Spatiotemporal Pyramid Flow Matching for climate emulation"
requires-python = ">=3.12,<3.13"
dependencies = [
  "accelerate==1.1.1",
  "cartopy==0.24.1",
  "dask==2024.12.0",
  "diffusers==0.31.0",
  "einops==0.8.0",
  "h5netcdf==1.4.1",
  "h5py==3.12.1",
  "huggingface-hub==0.32.3",
  "hydra-core==1.3.2",
  "imageio==2.36.0",
  "ipython==8.31.0",
  "matplotlib==3.9.2",
  "netCDF4==1.7.2",
  "numcodecs==0.14.1",
  "numpy==2.0.0",
  "omegaconf==2.3.0",
  "pandas==2.2.3",
  "pillow==11.0.0",
  "pytorch-lightning==2.2.3",
  "rich==13.9.4",
  "scikit-image==0.25.2",
  "scikit-learn==1.5.2",
  "scipy==1.14.1",
  "setuptools==75.3.0",
  "tensorboard==2.18.0",
  "tensorboardX==2.6.4",
  "timm==0.9.7",
  "torch==2.5.1",
  "torch-ema==0.3",
  "torchmetrics==1.5.2",
  "torchvision==0.20.1",
  "tqdm==4.67.0",
  "transformers==4.46.2",
  "wandb==0.18.6",
  "xarray==2024.11.0",
  "zarr==2.18.3",
  "zstandard==0.23.0",
]

[project.optional-dependencies]
dev = [
  "black==24.10.0",
  "ruff==0.11.12",
]

[tool.setuptools.packages.find]
include = ["emulator*"]

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

[tool.uv.sources]
torch = [
  { index = "pytorch-cu124", marker = "sys_platform == 'linux'" },
]
torchvision = [
  { index = "pytorch-cu124", marker = "sys_platform == 'linux'" },
]

[tool.black]
line-length = 119
target-version = ["py312"]

[tool.ruff]
line-length = 119
lint.select = ["E", "F", "I", "W"]
lint.ignore = ["E501", "F821"]

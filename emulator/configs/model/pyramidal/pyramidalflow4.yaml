defaults:
  #- /input_transform: 
  - /optimizer: adamw_pixelflow.yaml

_target_: emulator.models.pyramidal_flow_model.PyramidalFlowModel

model_name: PyramidalFlow

transformer_config:
  _target_: emulator.models.pyramidal_flow.mmdit_modules.modeling_pyramid_mmdit.PyramidDiffusionMMDiT
  height: 288
  width: 192
  cond_height: 144
  cond_width: 96
  num_attention_heads: 16 # Changed back to 16 from 17 after architecture standardization
  attention_head_dim: 72
  in_channels: 2
  cond_in_channels: 5
  num_layers: 4
  patch_size: 8
  cond_patch_size: 16
  joint_attention_dim: 1152
  add_temp_pos_embed: True
  interp_condition_pos: True
  use_temporal_causal: True
  use_flash_attn: False
  pos_embed_type: 'sincos'
  temp_pos_embed_type: 'rope'

encoder_config:
  _target_: emulator.models.pixelflow.encoder.TemporalPixelFlowEncoder
  num_channels: 5
  patch_size: 16
  model_dim: 1152

noise_scheduler_config:
  _target_: emulator.schedulers.pyramidal_flow.PyramidFlowMatchEulerDiscreteScheduler
  num_train_timesteps: 1000
  num_stages: 3
  shift: 1.0
  stage_range: [0, 0.33, 0.66, 1]
  ns: [4, 4]

num_inference_steps: 30

# @package _global_
# to execute this experiment run:
# python run.py experiment=example

defaults:
  - override /mode: exp.yaml
  - override /trainer: default.yaml # Was MultiGPU
  - override /model: spf/spf4.yaml
  - override /callbacks: default.yaml
  - override /logger: wandb.yaml
  - override /datamodule: spf/climatebench.yaml

# all parameters below will be merged with parameters from default configurations set above
# this allows you to overwrite only specified parameters

# name of the run determines folder name in logs
# can also be accessed by loggers
name: spf_climatebench_spf4_train

seed: 22201

trainer:
  min_epochs: 1
  max_epochs: 250 # was 500 then 200
  accumulate_grad_batches: 8
  check_val_every_n_epoch: 10
  devices: 1

only_test_model: False
num_eval_samples: 1  # Can set to >1 during testing
num_samples_viz: 3
eval_timescale: "monthly"

model:
  monitor: "llrmse_climax"
  finetune: False
  pretrained_run_id: null 
  pretrained_ckpt_dir: null

  llm_name: null

  emulator_config:
    encoder_hid_dim: 2048

logger:
  wandb:
      tags: ["spf", "climatebench", "train"]
